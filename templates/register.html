<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7f6;
            padding: 40px;
        }
        .card {
            max-width: 750px;
            margin: auto;
            background: #fff;
            padding: 50px;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }
        h2 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 30px;
            font-size: 36px; /* extra large title */
            font-weight: bold;
        }
        label {
            font-size: 20px; /* larger labels */
            font-weight: 500;
            color: #333;
        }
        input, select {
            font-size: 20px; /* larger input text */
            padding: 14px;
        }
        button {
            font-size: 22px; /* larger button text */
            padding: 16px;
        }
        @media (max-width: 600px) {
            body { padding: 12px; }
            .card { padding: 22px 16px; }
            h2 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register</h2>
        <form method="POST" enctype="multipart/form-data" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control form-control-lg" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control form-control-lg" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="dob" class="form-control form-control-lg" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Role</label>
                <select name="role" class="form-select form-select-lg">
                    <option value="staff">Staff</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Company</label>
                <select name="company" class="form-select form-select-lg">
                    <option value="Trece">Trece-Uno Auto Supply</option>
                    <option value="Auto Expert">Auto Expert</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control form-control-lg" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg" required>
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="show-password" onchange="togglePassword()">
                    <label class="form-check-label" for="show-password">See Password</label>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Profile Picture</label>
                <input type="file" name="profile_pic" class="form-control form-control-lg">
            </div>

            <div class="col-12">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control form-control-lg">
            </div>
            <div class="col-md-6">
                <label class="form-label">Contact Number</label>
                <input type="text" name="contact_no" class="form-control form-control-lg" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Date Started</label>
                <input type="date" name="date_started" class="form-control form-control-lg" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">SSS</label>
                <input type="text" name="sss" class="form-control form-control-lg">
            </div>
            <div class="col-md-6">
                <label class="form-label">PhilHealth</label>
                <input type="text" name="philhealth" class="form-control form-control-lg">
            </div>

            <div class="col-md-6">
                <label class="form-label">TIN</label>
                <input type="text" name="tin" class="form-control form-control-lg">
            </div>
            <div class="col-md-6">
                <label class="form-label">Pag-IBIG</label>
                <input type="text" name="pagibig" class="form-control form-control-lg">
            </div>

            <div class="col-md-6">
                <label class="form-label">Emergency Contact</label>
                <input type="text" name="emergency_contact" class="form-control form-control-lg">
            </div>
            <div class="col-md-6">
                <label class="form-label">Emergency Address</label>
                <input type="text" name="emergency_address" class="form-control form-control-lg">
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" name="same_address">
                    <label class="form-check-label">Same as my address</label>
                </div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary btn-lg w-100">Register</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            var x = document.getElementById("password");
            x.type = (x.type === "password") ? "text" : "password";
        }
    </script>
</body>
</html>
