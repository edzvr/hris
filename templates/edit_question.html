<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Questionnaire Item</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f7f6; margin:0; padding:20px; }
        .card { max-width:700px; margin:0 auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
        h2 { color:#1976d2; }
        label { display:block; margin-top:14px; font-weight:700; }
        input, textarea { box-sizing:border-box; width:100%; padding:10px; margin-top:6px; border:1px solid #c8d0d7; border-radius:5px; font:inherit; }
        textarea { min-height:100px; }
        .btn { display:inline-block; padding:10px 16px; margin-top:18px; border:0; border-radius:6px; background:#1976d2; color:#fff; text-decoration:none; cursor:pointer; }
        .btn-muted { background:#607d8b; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='soft_theme.css') }}">
</head>
<body>
    <div class="card">
        <h2>Edit Questionnaire Item</h2>
        <form method="POST">
            <label for="question_text">Question</label>
            <textarea id="question_text" name="question_text" required>{{ question.text }}</textarea>
            <label for="category">Category</label>
            <input id="category" type="text" name="category" value="{{ question.category or 'peer' }}">
            <button type="submit" class="btn">Save Changes</button>
            <a href="{{ url_for('manage_questions') }}" class="btn btn-muted">Cancel</a>
        </form>
        <p><a href="{{ url_for('dashboard_admin') }}" class="dashboard-back-link">Back to Dashboard</a></p>
    </div>
</body>
</html>
