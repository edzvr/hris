<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7f6;
            margin: 0;
            font-size: 18px;
            color: #212529;
        }
        .navbar {
            background: #2c3e50;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .navbar a:hover {
            background: #34495e;
        }
        .container {
            padding: 40px;
            max-width: 1200px;
            margin: auto;
            background: white;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #f2f2f2;
            font-weight: 600;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        button, .btn {
            padding: 12px 24px;
            border-radius: 8px;
            background: #7B2CBF; /* trendy purple */
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        button:hover, .btn:hover {
            background: #9D4EDD;
            transform: scale(1.03);
        }
        .status-approved { color: #2ECC71; font-weight: 600; }
        .status-pending { color: #F1C40F; font-weight: 600; }
        .status-rejected { color: #E74C3C; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar">
        {% if current_user.is_authenticated %}
            {% if current_user.role and 'staff' in current_user.role.lower() %}
                <a href="{{ url_for('dashboard_staff') }}">🏠 Dashboard</a>
            {% else %}
                <a href="{{ url_for('dashboard_admin') }}">🏠 Dashboard</a>
            {% endif %}
        {% else %}
            <a href="{{ url_for('login') }}">🏠 Login</a>
        {% endif %}
        <a href="{{ url_for('leave') }}">📄 Leave</a>
        <a href="{{ url_for('loan') }}">💳 Loan</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
