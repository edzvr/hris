<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Incident Report</title><link rel="stylesheet" href="{{ url_for('static', filename='soft_theme.css') }}"><style>body{font-family:Arial;padding:24px}.card{max-width:700px;margin:auto;background:#f8faf9;padding:24px;border-radius:8px}label{display:block;margin-top:14px}select,textarea{width:100%;box-sizing:border-box;padding:10px}textarea{min-height:120px}.btn{margin-top:16px;padding:10px 16px;background:#1976d2;color:#fff;border:0;border-radius:6px}#signature-pad{border:1px solid #263238;max-width:100%;touch-action:none}</style></head>
<body><main class="card"><h2>Incident Report</h2><form method="POST"><label>Employee<select name="reported_employee_id" required><option value="">Select coworker</option>{% for coworker in coworkers %}<option value="{{ coworker.id }}"{% if coworker.id == selected_coworker_id %} selected{% endif %}>{{ coworker.first_name }} {{ coworker.last_name }}</option>{% endfor %}</select></label><label>Category<select name="category" required><option value="compliment">Compliment</option><option value="lapses">Lapses</option><option value="other">Other</option></select></label><label>Description<textarea name="description" required></textarea></label><h4>Staff Signature</h4><canvas id="signature-pad" width="400" height="160"></canvas><button type="button" id="clear-signature">Clear</button><input type="hidden" name="signature" id="signature"><br><button class="btn" type="submit">Submit Incident Report</button></form><p><a href="{{ url_for('dashboard_staff') }}">Back to Dashboard</a></p></main><script>const canvas=document.getElementById('signature-pad'),ctx=canvas.getContext('2d'),hidden=document.getElementById('signature');let drawing=false;function point(e){const r=canvas.getBoundingClientRect(),source=e.touches?e.touches[0]:e;return{x:(source.clientX-r.left)*canvas.width/r.width,y:(source.clientY-r.top)*canvas.height/r.height}}function start(e){drawing=true;ctx.beginPath();ctx.moveTo(...Object.values(point(e)));e.preventDefault()}function draw(e){if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();e.preventDefault()}function stop(){drawing=false}canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',stop);canvas.addEventListener('mouseleave',stop);canvas.addEventListener('touchstart',start);canvas.addEventListener('touchmove',draw);canvas.addEventListener('touchend',stop);document.getElementById('clear-signature').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hidden.value=''};canvas.closest('form').addEventListener('submit',()=>hidden.value=canvas.toDataURL('image/png'));</script></body></html>
